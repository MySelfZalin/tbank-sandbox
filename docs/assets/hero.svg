<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title description">
  <title id="title">Sandbox Portfolio — пет-проект на Python</title>
  <desc id="description">Обложка Python backend для T-Invest API. Справа показан демонстрационный запрос GET /instruments/search?query=SBER и фрагмент JSON-ответа. Данные иллюстративные.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1f303e" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="620" fill="#0c141e"/>
  <rect x="672" width="928" height="620" fill="url(#grid)" opacity="0.34"/>
  <path d="M674 0V620" stroke="#203240" stroke-width="1" opacity="0.45"/>
  <path d="M0 619H1600" stroke="#30414c" stroke-width="2"/>

  <rect x="80" y="80" width="80" height="80" rx="20" fill="#22271f" stroke="#4b4730" stroke-width="1.5"/>
  <text x="120" y="133" text-anchor="middle" font-family="'JetBrainsMono Nerd Font', 'DejaVu Sans Mono', monospace" font-size="38" font-weight="500" fill="#ffd769">{}</text>
  <text x="184" y="127" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="19" font-weight="600" letter-spacing="2.2" fill="#a5b3c0">PYTHON BACKEND</text>

  <g font-family="'Noto Sans', 'DejaVu Sans', sans-serif" fill="#f3f6fa" font-size="82" font-weight="700" letter-spacing="-2.8">
    <text x="78" y="258">Sandbox</text>
    <text x="78" y="350">Portfolio</text>
  </g>
  <text x="80" y="401" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="26" fill="#b7c4d0">Пет-проект на Python · T-Invest API</text>

  <path d="M80 452H580" stroke="#263947" stroke-width="1.5"/>
  <circle cx="88" cy="491" r="5" fill="#74d8c8"/>
  <text x="108" y="499" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="22" font-weight="500" fill="#a3b8c6">T-Invest sandbox</text>

  <rect x="720" y="88" width="800" height="448" rx="22" fill="#071019" opacity="0.65"/>
  <rect x="720" y="80" width="800" height="448" rx="22" fill="#111d29" stroke="#344754" stroke-width="1.5"/>
  <path d="M720 141H1520" stroke="#344754" stroke-width="1.5"/>
  <circle cx="754" cy="111" r="5" fill="#6b7a86"/>
  <circle cx="773" cy="111" r="5" fill="#53616e"/>
  <circle cx="792" cy="111" r="5" fill="#3c4c59"/>
