  <text x="1484" y="119" text-anchor="end" font-family="'Noto Sans', 'DejaVu Sans', sans-serif" font-size="21" font-weight="500" fill="#c9d6e0">Фрагмент ответа</text>

  <rect x="752" y="166" width="66" height="38" rx="8" fill="#ffd769"/>
  <text x="785" y="192" text-anchor="middle" font-family="'JetBrainsMono Nerd Font', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="700" fill="#19222a">GET</text>
  <text x="836" y="192" font-family="'JetBrainsMono Nerd Font', 'DejaVu Sans Mono', monospace" font-size="24" fill="#e7edf3">/instruments/search?query=SBER</text>
  <path d="M752 224H1488" stroke="#293e4e" stroke-width="1"/>

  <g font-family="'JetBrainsMono Nerd Font', 'DejaVu Sans Mono', monospace" font-size="26" fill="#bbcbd8">
    <text x="752" y="270">{</text>
    <text x="779" y="311"><tspan fill="#dce6ee">"ticker"</tspan><tspan>: </tspan><tspan fill="#74d8c8">"SBER"</tspan><tspan>,</tspan></text>
    <text x="779" y="352"><tspan fill="#dce6ee">"currency"</tspan><tspan>: </tspan><tspan fill="#74d8c8">"rub"</tspan><tspan>,</tspan></text>
    <text x="779" y="393"><tspan fill="#dce6ee">"last_price"</tspan><tspan>: </tspan><tspan fill="#74d8c8">"286.01"</tspan><tspan>,</tspan></text>
